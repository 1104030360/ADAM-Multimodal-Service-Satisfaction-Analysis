# This project was generated with 0.3.19 using template: https://github.com/beeware/briefcase-template@v0.3.19

# 套件清單只寫在這裡：uv sync 照它（與 uv.lock）安裝 .venv，briefcase 也從這裡讀 requires
[project]
name = "myapp"
# app 的版本（Info.plist 的 CFBundleShortVersionString、設定頁 About）。每次發佈新的 app 手動加（T51）
version = "1.0.0"
# PEP 639 的寫法；原本 [tool.briefcase] 的 license.file 會讓 briefcase 每次都印一大段警告
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = "==3.13.*"
# 桌面用戶端（macOS、Python 3.13）的直接依賴。都有預先編好的 wheel：sounddevice 自帶 PortAudio，不需要 Homebrew
dependencies = [
    "PySide6_Essentials==6.12.0",
    "PySide6_Addons==6.12.0",
    "opencv-python==4.10.0.84",
    "mysql-connector-python==26.10.0",
    "python-dotenv==1.2.4",
    "PyMuPDF==1.25.5",
    "requests==2.34.2",
    "boto3[crt]==1.43.122",
    "sounddevice==0.5.6",
]

# 測試用的套件。briefcase dev --test 會把它們當成 test_requires 安裝；
# 下面 dev 群組的 "myapp[test]" 讓 uv sync 也一起安裝，所以版本只寫在這裡
[project.optional-dependencies]
test = [
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "moto[s3]==5.2.5",
]

# 開發工具：uv sync 預設會安裝 dev 群組，但它們不會進到打包出來的 app
[dependency-groups]
dev = [
    "briefcase==0.4.7",
    "myapp[test]",
]

[tool.uv]
# 這個 app 只在 macOS 上執行，uv.lock 只為 macOS 解析
environments = ["sys_platform == 'darwin'"]
# uv add 新增套件時寫成 ==（和上面一樣釘死版本）
add-bounds = "exact"

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests/unit", "tests/integration"]  # 先跑快的單元測試
pythonpath = ["src"]          # 測試要 import myapp，而套件放在 src/ 底下
addopts = ["-ra"]             # 結尾列出 skip、xfail 的原因
strict = true                 # 未註冊的 marker、xfail 意外通過、設定打錯都算失敗
empty_parameter_set_mark = "fail_at_collect"  # parametrize 拿到空清單（例如路徑寫錯）就報錯，不是默默略過
filterwarnings = [
    # PyMuPDF（SWIG 產生的擴充模組）在 Python 3.13 的已知警告，和這個專案的程式無關
    "ignore:builtin type .* has no __module__ attribute:DeprecationWarning",
]
markers = [
    "integration: 需要 Docker（拋棄式 MySQL 8.4 容器）。只跑單元測試：uv run pytest -m \"not integration\"",
]

[tool.coverage.run]
source = ["myapp"]
branch = true
omit = [
    # Briefcase 範本留下的 QMainWindow；沒有任何地方 import 它（__main__.py 走的是 main.py）
    "*/myapp/app.py",
    # 早期用 cv2.imshow 的錄影原型；沒有任何地方 import，而且它 import 的 google-cloud-storage 已經不在依賴裡
    "*/myapp/init/test.py",
]

[tool.coverage.report]
show_missing = true
fail_under = 75

[tool.briefcase]
# bundle id 是 bundle 加上 app 的名稱：io.github.1104030360.myapp。Briefcase 0.4.7 沒辦法單獨指定，想要的
# io.github.1104030360.adam 得把 app 和 Python 模組都改名成 adam，所以不改（T51）。發佈之後不要再改這個值：
# macOS 的鏡頭、麥克風權限都跟著它（偏好設定是 QSettings("ADAM", "myapp")，和 bundle id 無關）
bundle = "io.github.1104030360"
url = "https://github.com/1104030360/ADAM-Multimodal-Service-Satisfaction-Analysis"
author = "Timmy"
author_email = "5961timtim@gmail.com"

[tool.briefcase.app.myapp]
formal_name = "ADAM"   # 打包出來是 ADAM.app，Dock、選單列、權限詢問都寫 ADAM
description = "Record service sessions and review AI satisfaction analysis."
long_description = """ADAM records a service session with a customer camera, a staff camera and a microphone, uploads it for analysis, and shows face, voice and text satisfaction scores, coaching and reports for staff and managers.
"""
icon = "icons/adam"    # icons/adam.icns：開場畫面的原創標誌（眼睛形狀的聲波），來源見 src/myapp/images/SOURCES.md
# app 的程式碼：整個 src/myapp 複製進 app（qml/、images/ 也在裡面）
sources = [
    "src/myapp",
]
# 從 build 出來的 app 拿掉的東西，路徑相對於 build/myapp/macos/app/（T51）
cleanup_paths = [
    # 設定檔（資料庫密碼、IAM user 的金鑰）絕對不能包進 app：每台電腦放在 ~/Library/Application Support/ADAM/
    "{app.formal_name}.app/Contents/Resources/app/**/.env",
    "{app.formal_name}.app/Contents/Resources/app/**/.env.*",
    # T51 之前的下載快取在 src/myapp/init/ 底下（影片、圖表、帳號照片、報表），本機舊的快取不要包進去
    "{app.formal_name}.app/Contents/Resources/app/myapp/init/media",
    "{app.formal_name}.app/Contents/Resources/app/myapp/init/charts",
    "{app.formal_name}.app/Contents/Resources/app/myapp/init/reports",
    "{app.formal_name}.app/Contents/Resources/app/myapp/init/avatars",
    "{app.formal_name}.app/Contents/Resources/app/myapp/init/reports-pdf",
    # sounddevice 的 wheel 也帶了 Windows 的 PortAudio DLL
    "{app.formal_name}.app/Contents/Resources/app_packages/_sounddevice_data/portaudio-binaries/*.dll",
    # Qt 的 SQL 驅動外掛：app 不用 QtSql（資料庫走 mysql-connector），其中 ODBC、Mimer 的連到
    # /opt/homebrew、/usr/local 的函式庫（PySide6 建置機器上的路徑），留著會讓「沒有 Homebrew 的路徑」的檢查不乾淨
    "{app.formal_name}.app/Contents/Resources/app_packages/PySide6/Qt/plugins/sqldrivers",
]

test_sources = [
    "tests",
]

# briefcase dev 用 uv 建立自己的隔離環境（.briefcase/myapp/uv-dev.*）
env_manager = "uv"

# macOS 第一次用到鏡頭、麥克風時，詢問視窗上的說明（介面文字一律英文，PLAN D1）
permission.camera = "ADAM uses the camera to record service sessions."
permission.microphone = "ADAM uses the microphone to record service sessions."

[tool.briefcase.app.myapp.macOS]
universal_build = false   # 只支援 Apple Silicon（T51）：universal build 的 app 會大一倍
min_os_version = "14.0"   # PySide6 6.12、mysql-connector 26.10 的 wheel 最低要 macOS 14（Briefcase 預設 11.0，裝不了）
requires = [
    "std-nslog~=1.0.0",
]

