# This project was generated with 0.3.19 using template: https://github.com/beeware/briefcase-template@v0.3.19

# 套件清單只寫在這裡：uv sync 照它（與 uv.lock）安裝 .venv，briefcase 也從這裡讀 requires
[project]
name = "myapp"
version = "0.0.1"
# PEP 639 的寫法；原本 [tool.briefcase] 的 license.file 會讓 briefcase 每次都印一大段警告
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = "==3.13.*"
# 桌面用戶端（macOS、Python 3.13）的直接依賴。PyAudio 需要先安裝 PortAudio：brew install portaudio
dependencies = [
    "PySide6_Essentials==6.12.0",
    "PySide6_Addons==6.12.0",
    "opencv-python==4.10.0.84",
    "PyAudio==0.2.14",
    "mysql-connector-python==26.10.0",
    "python-dotenv==1.2.4",
    "PyMuPDF==1.25.5",
    "requests==2.34.2",
    "boto3==1.43.122",
]

# 測試用的套件。briefcase dev --test 會把它們當成 test_requires 安裝；
# 下面 dev 群組的 "myapp[test]" 讓 uv sync 也一起安裝，所以版本只寫在這裡
[project.optional-dependencies]
test = [
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "moto[s3]==5.2.5",
]

# 開發工具：uv sync 預設會安裝 dev 群組，但它們不會進到打包出來的 app
[dependency-groups]
dev = [
    "briefcase==0.4.7",
    "myapp[test]",
]

[tool.uv]
# 這個 app 只在 macOS 上執行，uv.lock 只為 macOS 解析
environments = ["sys_platform == 'darwin'"]
# uv add 新增套件時寫成 ==（和上面一樣釘死版本）
add-bounds = "exact"

[tool.pytest.ini_options]
# 測試要 import myapp，而套件放在 src/ 底下
pythonpath = ["src"]
testpaths = ["tests"]

[tool.briefcase]
bundle = "com.example"
url = "https://example.com/myapp"
author = "Timmy"
author_email = "5961timtim@gmail.com"

[tool.briefcase.app.myapp]
formal_name = "myapp"
description = "My first application"
long_description = """More details about the app should go here.
"""
sources = [
    "src/myapp",
]

resources = [
    "src/myapp/qml",
    "src/myapp/images",
    "src/myapp/init",
]

test_sources = [
    "tests",
]

# briefcase dev 用 uv 建立自己的隔離環境（.briefcase/myapp/uv-dev.*）
env_manager = "uv"

permission.camera = "錄製服務過程時需要使用鏡頭。"
permission.microphone = "錄製服務過程時需要使用麥克風。"

[tool.briefcase.app.myapp.macOS]
universal_build = false
requires = [
    "std-nslog~=1.0.0",
]

[tool.briefcase.app.myapp.linux]
requires = [
]

[tool.briefcase.app.myapp.linux.system.debian]
system_requires = [
]

system_runtime_requires = [
    # Derived from https://doc.qt.io/qt-6/linux-requirements.html
    "libxext6",
    "libxrender1",
    "libx11-xcb1",
    "libxkbcommon-x11-0",
    "libxcb-image0",
    "libxcb-cursor0",
    "libxcb-shape0",
    "libxcb-randr0",
    "libxcb-xfixes0",
    "libxcb-sync1",
    "libxcb-icccm4",
    "libxcb-keysyms1",
    "libfontconfig1",
    "libsm6",
    "libice6",
    "libglib2.0-0",
    "libgl1",
    "libegl1",
    "libdbus-1-3",
]

[tool.briefcase.app.myapp.linux.system.rhel]
system_requires = [
]

system_runtime_requires = [
    "qt6-qtbase-gui",
]

[tool.briefcase.app.myapp.linux.system.suse]
system_requires = [
]

system_runtime_requires = [
    "libgthread-2_0-0",
    "libQt6Gui6",
]

[tool.briefcase.app.myapp.linux.system.arch]
system_requires = [
]

system_runtime_requires = [
    "qt6-base",
]

[tool.briefcase.app.myapp.linux.appimage]
manylinux = "manylinux_2_28"

system_requires = [
# ?? FIXME
]

linuxdeploy_plugins = [
]

[tool.briefcase.app.myapp.linux.flatpak]
flatpak_runtime = "org.kde.Platform"
flatpak_runtime_version = "6.6"
flatpak_sdk = "org.kde.Sdk"

[tool.briefcase.app.myapp.windows]
requires = [
]

# Mobile deployments
[tool.briefcase.app.myapp.iOS]
supported = false

[tool.briefcase.app.myapp.android]
supported = false

# Web deployments
[tool.briefcase.app.myapp.web]
supported = false

