<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1110" viewBox="0 0 1600 1110" role="img" aria-labelledby="title desc">
<title id="title">ADAM real analysis pipeline</title>
<desc id="desc">An EC2 worker receives accepted analysis jobs from SQS and runs every analysis model on the CPU. pyannote finds speaker turns shared by voice emotion and word-level transcript alignment. faster-whisper medium with int8 transcribes Chinese; OpenCC converts it to Taiwan Traditional Chinese, and opus-mt-zh-en translates it for VADER. Wav2Vec2 scores voice emotion and DeepFace scores facial emotion from the customer and staff cameras. RDS holds scores, state, file references and the completed job; S3 holds five charts, the transcript and report data. The API generates PDF reports from committed results. Optional Ollama Cloud calls add service outcomes, to-dos and report explanations.</desc>
<!-- Colors and typography follow myapp/src/myapp/qml/components/Theme.qml, like architecture.svg. -->
<defs>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#E6E8EB"/></marker>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#C3C8CF"/></marker>
<marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#9AA1AB"/></marker>
<style>
text{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;fill:#ECEEF1}.title{font-size:30px;font-weight:500;fill:#F3F4F6}.subtitle{font-size:21px;fill:#9AA1AB}.heading{font-size:26px;font-weight:700}.body{font-size:21px}.small{font-size:19px;fill:#B4BAC2}.label{font-size:19px;font-weight:600}.kicker{font-size:16px;font-weight:600;letter-spacing:1px;fill:#9AA1AB}
.wordmark{font-size:48px;font-weight:300;letter-spacing:12px;fill:#F3F4F6}.badge{font-size:17px;font-weight:600;fill:#0E1013}
</style>
</defs>
<rect width="1600" height="1110" fill="#0B0C0E"/>
<text x="48" y="84" class="wordmark">ADAM</text><text x="330" y="80" class="title">Real analysis pipeline</text>
<text x="48" y="126" class="subtitle">SQS → EC2 worker · CPU only. Model files load offline; the API runs separately.</text>
<rect x="1200" y="40" width="352" height="44" rx="22" fill="#E6E8EB" stroke="#E6E8EB" stroke-width="1.5"/>
<text x="1376" y="69" class="badge" text-anchor="middle">Whisper medium · int8 · CPU</text>

<!-- Column headings -->
<text x="48" y="186" class="kicker">INPUT · S3</text>
<text x="348" y="186" class="kicker">MODELS · EC2 WORKER</text>
<text x="1178" y="186" class="kicker">SCORES AND CHARTS</text>

<!-- Inputs -->
<rect x="48" y="206" width="260" height="264" rx="16" fill="#15171B" stroke="#24272C" stroke-width="1.5"/>
<text x="76" y="250" class="heading">Microphone</text>
<text x="76" y="286" class="body">{sid}_audio.wav</text>
<text x="76" y="320" class="small">Two speakers:</text>
<text x="76" y="348" class="small">staff and customer</text>
<rect x="48" y="530" width="260" height="140" rx="16" fill="#15171B" stroke="#24272C" stroke-width="1.5"/>
<text x="76" y="574" class="heading">Cameras</text>
<text x="76" y="610" class="body">cam0 · customer</text>
<text x="76" y="642" class="body">cam1 · staff</text>

<!-- pyannote: shared by the text and voice lanes -->
<rect x="348" y="206" width="230" height="264" rx="16" fill="#1A1D21" stroke="#2C3036" stroke-width="1.5"/>
<text x="372" y="250" class="heading">pyannote 3.1</text>
<text x="372" y="286" class="body">Who spoke when</text>
<text x="372" y="320" class="small">Runs once per service;</text>
<text x="372" y="348" class="small">more turns = staff</text>

<!-- Text lane -->
<rect x="618" y="206" width="250" height="114" rx="14" fill="#1A1D21" stroke="#2C3036" stroke-width="1.5"/>
<text x="642" y="244" class="heading">faster-whisper</text>
<text x="642" y="276" class="small">Chinese speech → text</text>
<text x="642" y="302" class="small">Words → speaker turns</text>
<rect x="898" y="206" width="250" height="114" rx="14" fill="#1A1D21" stroke="#2C3036" stroke-width="1.5"/>
<text x="922" y="244" class="body">OpenCC · opus-mt</text>
<text x="922" y="276" class="small">Taiwan Traditional;</text>
<text x="922" y="302" class="small">English for VADER</text>
<rect x="1178" y="206" width="374" height="114" rx="14" fill="#15171B" stroke="#24272C" stroke-width="1.5"/>
<text x="1202" y="244" class="heading">Text · VADER</text>
<text x="1202" y="276" class="small">Text score per role</text>
<text x="1202" y="302" class="small">TEXT chart · transcript</text>

<!-- Voice lane -->
<rect x="618" y="356" width="530" height="114" rx="14" fill="#1A1D21" stroke="#2C3036" stroke-width="1.5"/>
<text x="642" y="394" class="heading">Wav2Vec2 · voice emotion</text>
<text x="642" y="426" class="small">Each speaker turn, cut into chunks of 15 s or less</text>
<rect x="1178" y="356" width="374" height="114" rx="14" fill="#15171B" stroke="#24272C" stroke-width="1.5"/>
<text x="1202" y="394" class="heading">Audio</text>
<text x="1202" y="426" class="small">Audio score per role</text>
<text x="1202" y="452" class="small">AUDIO chart</text>

<!-- Face lane -->
<rect x="348" y="530" width="800" height="140" rx="14" fill="#1A1D21" stroke="#2C3036" stroke-width="1.5"/>
<text x="372" y="572" class="heading">DeepFace · facial emotion</text>
<text x="372" y="606" class="small">One frame per second from each camera; the dominant emotion</text>
<text x="372" y="634" class="small">becomes positive, neutral or negative</text>
<rect x="1178" y="530" width="374" height="140" rx="14" fill="#15171B" stroke="#24272C" stroke-width="1.5"/>
<text x="1202" y="572" class="heading">Facial</text>
<text x="1202" y="606" class="small">Facial score per role</text>
<text x="1202" y="634" class="small">3 face charts · time series</text>

