<text x="76" y="790" class="heading">Service outcome</text>
<text x="76" y="826" class="body">Outcome + to-dos from the</text>
<text x="76" y="860" class="body">transcript (Ollama Cloud)</text>
<text x="76" y="902" class="small">Optional; every item must quote</text>
