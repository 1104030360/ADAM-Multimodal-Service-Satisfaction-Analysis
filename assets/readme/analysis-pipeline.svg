<path d="M 308 338 H 348" fill="none" stroke="#C3C8CF" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-teal)"/>
<path d="M 578 263 H 618" fill="none" stroke="#E6E8EB" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
