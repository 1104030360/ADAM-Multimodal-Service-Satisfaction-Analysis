<path d="M 1552 263 H 1574 V 700 H 1320 V 746" fill="none" stroke="#E6E8EB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<path d="M 1552 413 H 1574 M 1552 600 H 1574" fill="none" stroke="#E6E8EB" stroke-width="3" stroke-linecap="round"/>
<text x="48" y="728" class="kicker">AFTER EACH ANALYSIS</text>
<rect x="1088" y="746" width="464" height="226" rx="16" fill="#15171B" stroke="#24272C" stroke-width="1.5"/>
<text x="1116" y="790" class="heading">Saved results</text>
<text x="1116" y="826" class="body">RDS: scores · state · file keys</text>
<text x="1116" y="860" class="body">S3: 5 charts · text · report-data</text>
