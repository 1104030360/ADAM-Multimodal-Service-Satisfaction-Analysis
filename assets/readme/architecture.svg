<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1140" viewBox="0 0 1600 1140" role="img" aria-labelledby="title desc">
<title id="title">ADAM architecture</title>
<desc id="desc">The PySide6 and QML desktop records services, reviews media and displays reports. It connects directly to S3 and RDS and calls an analysis/report API on EC2. The deployed service may be the real analyzer, which runs Whisper and the other models on the EC2 CPU, or a placeholder test implementation. Optional Ollama Cloud calls generate report explanations.</desc>
