<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1180" viewBox="0 0 1600 1180" role="img" aria-labelledby="title desc">
<title id="title">ADAM architecture with durable analysis jobs</title>
<desc id="desc">The PySide6 and QML desktop records services, reviews results and reports, and supports Coaching and My Actions. It accesses private S3 objects and RDS for MySQL directly. The real backend uses image adam-analyzer:2 in separate API and worker containers on EC2. The API atomically saves an analysis job, an outbox event and service status 2 before returning HTTP 200. Its outbox publisher sends the event to Amazon SQS. A worker receives the service ID, claims and renews a database lease, runs offline CPU models, uploads outputs, commits results and status 3, then deletes the message. PDF reports are generated by the API, outside the analysis queue. Optional Ollama Cloud calls add report explanations, outcomes and to-dos with checked transcript citations.</desc>
