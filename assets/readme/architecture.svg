<text x="1188" y="346" class="small">CPU · Offline models</text>
<text x="1188" y="376" class="small">Claim + renew a lease</text>
<text x="1188" y="410" class="small">Upload analysis output</text>
<text x="1188" y="450" class="label">Commit results + status 3</text>
<text x="1188" y="480" class="small">Then delete SQS message</text>
<text x="1188" y="514" class="small">Optional AI service outcome</text>
